[package]
name = "quietkeys"
version = "1.0.0"
description = "A local-only, encrypted desktop password manager"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quietkeys_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.6.0", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
secrecy = "0.10.3"
rand = "0.10.3"
getrandom = "0.4.3"
zxcvbn = "3.1.1"
base64 = "0.23.1"
tauri-plugin-clipboard-manager = "2.3.3"
zeroize = { version = "1.9.0", features = ["derive"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.26.1", features = ["v4"] }
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tauri-plugin-dialog = "2.7.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSData"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard"] }

# Argon2 is unusably slow unoptimized: keeps unlock and tests with real params fast.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
